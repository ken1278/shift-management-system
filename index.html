<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>総合シフト管理 ＆ 給料連動システム</title>
<style>
  :root {
    --sat-bg: #eff6ff; --sat-color: #1d4ed8;
    --sun-bg: #fef2f2; --sun-color: #b91c1c;
    --holiday-bg: #fff1f2; --holiday-color: #be123c;
    --header-bg: #f8fafc; --border-color: #cbd5e1;
    /* 固定列の幅（ここを変えるだけで sticky の位置も追従する） */
    --staff-w: 110px;
    --stat-w: 64px;
    --day-w: 30px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    margin: 0; padding: 12px; background: #f1f5f9; color: #0f172a; font-size: 13px;
    overflow-x: hidden;
  }
  .app-header {
    background: #fff; padding: 12px 16px; border-radius: 8px;
    border: 1px solid var(--border-color); margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .header-title-box h1 { margin: 0; font-size: 18px; font-weight: bold; }
  .facility-badge { font-size: 12px; color: #64748b; margin-top: 2px; }
  .header-center { display: flex; align-items: center; gap: 8px; }
  .header-center h2 { margin: 0; font-size: 16px; color: #1e293b; min-width: 170px; text-align: center; }
  .month-nav { border: 1px solid var(--border-color); background: #fff; border-radius: 4px; width: 30px; height: 28px; cursor: pointer; font-size: 14px; }
  .month-nav:hover { background: #f1f5f9; }
  .header-right { text-align: right; font-size: 11px; color: #475569; }

  .controls-bar {
    display: flex; gap: 8px; margin-bottom: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }
  .controls-bar > div { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: none; padding: 7px 14px; border-radius: 4px; font-weight: 600; font-size: 12px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;
  }
  .btn-menu { background: #0f172a; color: #fff; }
  .btn-add { background: #2563eb; color: #fff; }
  .btn-pay { background: #059669; color: #fff; }
  .btn-print { background: #475569; color: #fff; }
  .btn-sub { background: #e2e8f0; color: #334155; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn:hover { opacity: 0.9; }

  /* 入力パレット（ブラシ） */
  .palette {
    background: #fff; border: 1px solid var(--border-color); border-radius: 6px;
    padding: 6px 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .palette-label { font-weight: 600; font-size: 12px; color: #475569; margin-right: 4px; }
  .palette-hint { font-size: 11px; color: #64748b; margin-left: auto; }
  .brush {
    border: 2px solid transparent; border-radius: 4px; padding: 4px 10px; font-size: 12px;
    font-weight: bold; cursor: pointer;
  }
  .brush.active { border-color: #0f172a; box-shadow: 0 0 0 2px #fff inset; }
  .brush-none { background: #fff; color: #334155; border-color: var(--border-color); }

  .group-filter {
    display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding: 6px;
    background: #fff; border: 1px solid var(--border-color); border-radius: 6px;
    scrollbar-width: thin;
  }
  .group-tab {
    flex: 0 0 auto; border: 1px solid var(--border-color); background: #fff; color: #334155;
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .group-tab.active { background: #0f172a; border-color: #0f172a; color: #fff; }
  .group-action {
    flex: 0 0 auto; border: 1px dashed #94a3b8; background: #f8fafc; color: #334155;
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .group-action:hover { background: #e2e8f0; border-style: solid; }
  .group-action.rename { border-style: solid; color: #1d4ed8; border-color: #bfdbfe; background: #eff6ff; }

  .table-container {
    max-height: 72vh; overflow: auto; border: 1px solid var(--border-color);
    background: #fff; border-radius: 4px; position: relative;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  table { border-collapse: separate; border-spacing: 0; font-size: 12px; white-space: nowrap; }
  th, td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 4px 4px; text-align: center; }

  /* ヘッダーは1行（日付＋曜日を縦に並べる）にして sticky の top ずれを無くす */
  thead th { position: sticky; top: 0; z-index: 10; background: var(--header-bg); line-height: 1.25; }
  thead th .wd { display: block; font-size: 10px; font-weight: normal; }

  .col-staff {
    position: sticky; left: 0; z-index: 5; background: #fff; text-align: left;
    width: var(--staff-w); min-width: var(--staff-w); max-width: var(--staff-w);
    overflow: hidden; text-overflow: ellipsis; box-shadow: 2px 0 0 var(--border-color);
  }
  .staff-name { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .staff-meta { font-size: 10px; color: #64748b; font-weight: normal; }
  .mobile-summary { display: none; }
  .staff-group { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 10px; color: #475569; }
  .group-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  /* 役職・資格列：通常は非表示。「詳細表示」ON のときだけスクロールで流れる列として出す */
  .col-info { display: none; text-align: left; font-size: 11px; color: #475569; }
  body.show-info .col-info { display: table-cell; }
  .info-toggle { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; cursor: pointer; }
  .staff-actions button {
    border: none; background: none; cursor: pointer; font-size: 12px; color: #94a3b8; padding: 0 2px;
  }
  .staff-actions button:hover { color: #2563eb; }

  .col-stat {
    position: sticky; z-index: 5; background: #f8fafc; font-weight: bold;
    width: var(--stat-w); min-width: var(--stat-w); max-width: var(--stat-w);
  }
  .col-stat.s1 { right: calc(var(--stat-w) * 2); box-shadow: -2px 0 0 var(--border-color); }
  .col-stat.s2 { right: var(--stat-w); }
  .col-stat.s3 { right: 0; }
  thead th.col-staff, thead th.col-stat { z-index: 20; background: var(--header-bg); }

  .sat { background-color: var(--sat-bg); color: var(--sat-color); }
  .sun { background-color: var(--sun-bg); color: var(--sun-color); }
  .holiday { background-color: var(--holiday-bg); color: var(--holiday-color); }

  .shift-cell {
    width: var(--day-w); min-width: var(--day-w); max-width: var(--day-w);
    cursor: pointer; user-select: none; touch-action: pan-x pan-y; position: relative;
  }
  body.brush-active .shift-cell { touch-action: none; }
  .shift-cell:hover { outline: 2px solid #2563eb; outline-offset: -2px; }
  .shift-code { display: block; line-height: 1.1; }
  .duty-code {
    display: block; margin-top: 2px; font-size: 9px; line-height: 1; font-weight: 800;
    color: #334155; overflow: hidden; text-overflow: ellipsis;
  }
  .shift-日 { background: #e0f2fe; color: #0369a1; }
  .shift-早 { background: #fef9c3; color: #854d0e; }
  .shift-遅 { background: #fce7f3; color: #9d174d; }
  .shift-夜 { background: #ede9fe; color: #5b21b6; font-weight: bold; }
  .shift-明 { background: #f5f3ff; color: #7c3aed; }
  .shift-休 { background: #f8fafc; color: #94a3b8; }
  .shift-有 { background: #dcfce7; color: #15803d; font-weight: bold; }
  /* 契約上の勤務不可曜日に勤務を入れたセル */
  .violation::after {
    content: ""; position: absolute; top: 0; right: 0;
    border-top: 7px solid #dc2626; border-left: 7px solid transparent;
  }

  /* 日別人数（下部固定） */
  tfoot td { background: #f8fafc; font-size: 11px; }
  tfoot tr:first-child td { border-top: 2px solid var(--border-color); }
  tfoot .short { color: #dc2626; font-weight: bold; }

  .group-heading td {
    background: #e2e8f0; color: #1e293b; text-align: left; font-weight: 800;
    padding: 6px 10px; border-top: 2px solid #94a3b8;
  }
  .group-heading .group-count { margin-left: 6px; color: #64748b; font-size: 10px; font-weight: 600; }

  #popover {
    position: fixed; display: none; background: #fff; border: 1px solid #94a3b8;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.15); border-radius: 6px; padding: 6px; gap: 4px; z-index: 100;
    flex-wrap: wrap; max-width: 300px;
  }
  #popover button { border: none; padding: 6px 9px; border-radius: 3px; font-size: 12px; cursor: pointer; color: #fff; font-weight: bold; }
  .popover-section { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .popover-section + .popover-section { border-top: 1px solid #e2e8f0; margin-top: 4px; padding-top: 6px; }
  .popover-label { width: 100%; font-size: 10px; color: #64748b; font-weight: 700; }
  #popover .duty-btn { color: #0f172a; background: #e2e8f0; border: 1px solid #cbd5e1; }
  #popover .duty-clear { color: #475569; background: #fff; border: 1px solid #cbd5e1; }

  #drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 198; }
  #drawer {
    position: fixed; top: 0; left: -340px; width: 320px; height: 100%; background: #fff;
    box-shadow: 4px 0 12px rgba(0,0,0,0.15); transition: left 0.25s ease; z-index: 199;
    padding: 20px; overflow-y: auto;
  }
  #drawer.open { left: 0; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; }
  .form-group input, .form-group select { width: 100%; padding: 6px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 4px; }
  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; }
  .weekday-picks { display: flex; gap: 4px; flex-wrap: wrap; }
  .weekday-picks label { display: inline-flex; align-items: center; gap: 2px; font-weight: normal; }
  .weekday-picks input { width: auto; }
  .settings-section { border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: 18px; }
  .settings-section h4 { margin: 0 0 8px; font-size: 13px; }
  .settings-note { margin: 0 0 10px; color: #64748b; font-size: 11px; line-height: 1.5; }
  .settings-list { display: grid; gap: 6px; margin-bottom: 8px; }
  .settings-item { display: grid; grid-template-columns: 14px minmax(0, 1fr) 40px 30px; gap: 6px; align-items: center; }
  .settings-item.group-item { grid-template-columns: 14px minmax(0, 1fr) 30px; }
  .settings-item input { min-width: 0; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; }
  .settings-item button { border: none; background: #fee2e2; color: #b91c1c; border-radius: 4px; height: 30px; cursor: pointer; }
  .add-setting-row { display: flex; gap: 6px; }
  .add-setting-row input { flex: 1; min-width: 0; }
  .add-setting-row .code-input { flex: 0 0 52px; }

  #modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 199; }
  .modal-box {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #fff; border: 1px solid #94a3b8; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    padding: 20px; width: 520px; max-width: 92vw; max-height: 90vh; overflow-y: auto; z-index: 200; border-radius: 8px;
  }
  .modal-box h3 { margin-top: 0; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 12px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 300;
  }
  #toast.show { opacity: 1; }

  .mobile-period-nav { display: none; }

  /* スマホ・狭い画面：固定列を細くし、集計列は固定しない（日付を見やすく） */
  @media (max-width: 760px) {
    :root { --staff-w: 90px; --day-w: clamp(38px, calc((100vw - 102px) / 7), 42px); }
    body { padding: 6px; font-size: 14px; }
    .controls-bar { gap: 6px; }
    .controls-bar > div { width: 100%; gap: 6px; }
    .controls-bar .btn { flex: 1; justify-content: center; min-height: 42px; padding: 8px; }
    .app-header { padding: 10px; align-items: stretch; gap: 8px; }
    .header-title-box { text-align: center; }
    .header-title-box h1 { font-size: 16px; }
    .header-center { justify-content: center; order: -1; }
    .header-center h2 { font-size: 15px; min-width: 160px; }
    .header-right { text-align: center; }
    .palette { flex-wrap: nowrap; overflow-x: auto; padding: 8px; scrollbar-width: thin; }
    .palette-label, .palette-hint { display: none; }
    .brush, .info-toggle { flex: 0 0 auto; min-height: 38px; }
    .mobile-period-nav {
      display: grid; grid-template-columns: minmax(82px, 1fr) minmax(120px, 1.4fr) minmax(82px, 1fr);
      align-items: center; gap: 6px; margin-bottom: 8px; padding: 8px;
      background: #fff; border: 1px solid var(--border-color); border-radius: 8px;
    }
    .mobile-period-nav button {
      min-height: 40px; border: 1px solid var(--border-color); border-radius: 6px;
      background: #f8fafc; color: #0f172a; font-weight: 700;
    }
    .mobile-period-nav button:disabled { opacity: 0.4; }
    .mobile-period-nav strong { text-align: center; font-size: 13px; line-height: 1.3; }
    .mobile-swipe-hint { grid-column: 1 / -1; text-align: center; font-size: 11px; color: #64748b; }
    .table-container { max-height: 60vh; border-radius: 8px; }
    table { min-width: max-content; font-size: 13px; }
    th, td { padding: 8px 4px; }
    thead th { line-height: 1.4; }
    .col-staff { text-align: left; }
    .staff-name { align-items: flex-start; font-size: 13px; }
    .mobile-summary { display: block; margin-top: 3px; line-height: 1.3; }
    .shift-cell { font-size: 14px; font-weight: 700; }
    .duty-code { font-size: 9px; }
    .group-filter { margin-bottom: 8px; }
    .group-tab, .group-action { min-height: 38px; padding: 7px 12px; }
    .group-heading td { padding: 7px 8px; }
    .col-stat { display: none; position: static; }
    body.show-info .col-info { display: none; }
    #popover { max-width: calc(100vw - 16px); padding: 8px; }
    #popover button { min-width: 58px; min-height: 42px; font-size: 14px; }
    #drawer { width: min(320px, 88vw); }
    .palette-hint { display: none; }
  }

  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    .no-print, #popover, #drawer, #drawer-backdrop, #modal-backdrop, .modal-box, .staff-actions, #toast { display: none !important; }
    body { background: #fff !important; padding: 0 !important; font-size: 7.5pt !important; }
    .app-header { border: none; padding: 0 0 6px; }
    .table-container { overflow: visible !important; max-height: none !important; border: none !important; }
    table { width: 100% !important; table-layout: fixed; border-collapse: collapse !important; }
    th, td { border: 0.5pt solid #475569 !important; padding: 2px 1px !important; }
    .col-staff, .col-stat, thead th { position: static !important; box-shadow: none !important; }
    .shift-cell { width: auto; min-width: 0; max-width: none; }
    .col-stat.s1, .col-stat.s2, .col-info { display: none !important; }
    thead { display: table-header-group !important; }
    tr { page-break-inside: avoid !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="controls-bar no-print">
  <div>
    <button class="btn btn-menu" onclick="toggleDrawer()">≡ 設定・印刷</button>
    <button class="btn btn-add" onclick="openEmpModal()">＋ 新規スタッフ追加</button>
  </div>
  <div>
    <button class="btn btn-pay" onclick="exportPayroll()">給料明細データ出力</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 掲示板印刷</button>
  </div>
</div>

<div class="app-header">
  <div class="header-title-box">
    <h1 id="disp-company"></h1>
    <div class="facility-badge" id="disp-facility"></div>
  </div>
  <div class="header-center">
    <button class="month-nav no-print" onclick="shiftMonth(-1)" title="前月">◀</button>
    <h2 id="disp-title"></h2>
    <button class="month-nav no-print" onclick="shiftMonth(1)" title="翌月">▶</button>
  </div>
  <div class="header-right">
    <div><strong>期間:</strong> <span id="disp-period"></span></div>
    <div><strong>締め:</strong> <span id="disp-closing"></span> ／ <strong>決済:</strong> <span id="disp-payment"></span></div>
  </div>
</div>

<div class="palette no-print" id="palette">
  <span class="palette-label">入力モード:</span>
</div>

<div class="group-filter no-print" id="group-filter" aria-label="表示するグループ"></div>

<div class="mobile-period-nav no-print" id="mobile-period-nav" aria-label="スマホ用表示期間の切り替え">
  <button type="button" id="mobile-prev" onclick="shiftMobileWeek(-1)">‹ 前の7日</button>
  <strong id="mobile-range"></strong>
  <button type="button" id="mobile-next" onclick="shiftMobileWeek(1)">次の7日 ›</button>
  <span class="mobile-swipe-hint">シフトをタップして変更できます</span>
</div>

<div class="table-container">
  <table id="shift-table">
    <thead><tr id="head-row"></tr></thead>
    <tbody id="table-body"></tbody>
    <tfoot id="table-foot"></tfoot>
  </table>
</div>

<div id="popover"></div>

<div id="drawer-backdrop" onclick="toggleDrawer()"></div>
<div id="drawer">
  <h3>事業所・締め日設定</h3>
  <div class="form-group">
    <label>会社名</label>
    <input type="text" id="cfg-company" onchange="updateConfig()">
  </div>
  <div class="form-group">
    <label>施設・店舗名</label>
    <input type="text" id="cfg-facility" onchange="updateConfig()">
  </div>
  <div class="form-group">
    <label>対象年 / 月</label>
    <div class="form-row">
      <input type="number" id="cfg-year" onchange="updateConfig()">
      <input type="number" id="cfg-month" min="1" max="12" onchange="updateConfig()">
    </div>
  </div>
  <div class="form-group">
    <label>締め日（1〜30 または 末日）</label>
    <input type="text" id="cfg-closing" onchange="updateConfig()">
  </div>
  <div class="form-group">
    <label>給与決済日（支払日）</label>
    <input type="text" id="cfg-payment" onchange="updateConfig()">
  </div>
  <div class="form-group">
    <label>1日あたりの必要人数（下回ると赤表示）</label>
    <div class="form-row">
      <div><small>日勤帯（日・早・遅）</small><input type="number" id="cfg-need-day" min="0" onchange="updateConfig()"></div>
      <div><small>夜勤</small><input type="number" id="cfg-need-night" min="0" onchange="updateConfig()"></div>
    </div>
  </div>
  <section class="settings-section">
    <h4>業種テンプレート</h4>
    <p class="settings-note">業種に合わせたグループと担当の例をまとめて設定できます。適用後も自由に変更できます。</p>
    <div class="form-row">
      <select id="cfg-industry">
        <option value="care">介護施設</option>
        <option value="factory">工場</option>
        <option value="restaurant">飲食店</option>
        <option value="retail">小売店</option>
        <option value="office">一般企業</option>
        <option value="custom">自由設定</option>
      </select>
      <button class="btn btn-sub" type="button" onclick="applyIndustryTemplate()">適用</button>
    </div>
  </section>
  <section class="settings-section">
    <h4>グループ・部署</h4>
    <p class="settings-note">スタッフの所属や勤務表の区分です。例：ナース、デイサービス、製造A、検品。</p>
    <div class="settings-list" id="group-settings-list"></div>
    <div class="add-setting-row">
      <input type="text" id="new-group-name" placeholder="新しいグループ名">
      <button class="btn btn-add" type="button" onclick="addGroup()">追加</button>
    </div>
  </section>
  <section class="settings-section">
    <h4>当日の担当</h4>
    <p class="settings-note">勤務区分とは別に、その日の役割を登録します。例：配送、入浴、梱包、レジ。</p>
    <div class="settings-list" id="duty-settings-list"></div>
    <div class="add-setting-row">
      <input type="text" id="new-duty-name" placeholder="新しい担当名">
      <input type="text" id="new-duty-code" class="code-input" maxlength="2" placeholder="略称">
      <button class="btn btn-add" type="button" onclick="addDuty()">追加</button>
    </div>
  </section>
  <hr style="margin:20px 0; border:none; border-top:1px solid #e2e8f0;">

// シフト種別の定義（表示・集計・パレットはすべてここから生成）

const GROUP_COLORS = ["#2563eb", "#0d9488", "#d97706", "#7c3aed", "#dc2626", "#475569"];

      { id: "delivery", name: "配送", code: "配", color: "#ea580c" },
      { id: "cleaning", name: "清掃", code: "清", color: "#64748b" }
    ]
  },

    ]
  },
  custom: {

  }
};
const DEFAULT_GROUPS = structuredClone(INDUSTRY_TEMPLATES.care.groups);
const DEFAULT_DUTIES = structuredClone(INDUSTRY_TEMPLATES.care.duties);

const DEFAULT_CONFIG = {
  company: "社会福祉法人 幸寿会",
  facility: "特別養護老人ホーム さくら苑 2F",
  year: 2026, month: 10, closing: "15", payment: "翌月10日払い",
  needDay: 3, needNight: 1, industry: "care"
};

const DEFAULT_EMPLOYEES = [
  { id: "EMP001", name: "山田 太郎", role: "リーダー", qual: "介護福祉士 / 常勤", groupId: "care", unwork: [0], times: { work: 8, night: 14 } },
  { id: "EMP002", name: "佐藤 花子", role: "主任", qual: "看護師 / 常勤", groupId: "nurse", unwork: [0, 6], times: { work: 8, night: 0 } },
  { id: "EMP003", name: "鈴木 一郎", role: "スタッフ", qual: "調理師 / パート", groupId: "day-service", unwork: [], times: { work: 5.5, night: 0 } },
  { id: "EMP004", name: "高橋 健二", role: "フロア長", qual: "介護福祉士 / 夜勤専従", groupId: "care", unwork: [], times: { work: 8, night: 15 } },
  { id: "EMP005", name: "田中 美咲", role: "派遣", qual: "介護助手 / 派遣スタッフ", groupId: "care", unwork: [0, 6], times: { work: 8, night: 0 } }
];

let config = { ...DEFAULT_CONFIG };
let employees = structuredClone(DEFAULT_EMPLOYEES);
let shiftData = {};
let groups = structuredClone(DEFAULT_GROUPS);
let duties = structuredClone(DEFAULT_DUTIES);
let assignmentData = {};
let dataVersion = 2;
let activeTarget = null;   // ポップオーバーの対象セル
let brush = null;          // 選択中のブラシ（null = ポップオーバーで選択）
let painting = false;
let editingEmpId = null;
let showInfo = false;      // 役職・資格列を表示するか（通常は氏名のみ）
let activeGroupFilter = "all";
let mobileWeekStart = 0;   // スマホでは7日ずつ表示する
let wasMobileView = window.matchMedia("(max-width: 760px)").matches;

/* ---------- 保存・読み込み ---------- */
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ dataVersion, config, employees, shiftData, groups, duties, assignmentData })); } catch (e) { /* 保存不可の環境では無視 */ }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.config) config = { ...DEFAULT_CONFIG, ...data.config };
    if (Array.isArray(data.employees)) employees = data.employees;
    if (data.shiftData) shiftData = data.shiftData;
    if (Array.isArray(data.groups) && data.groups.length) groups = data.groups;
    if (Array.isArray(data.duties)) duties = data.duties;
    if (data.assignmentData) assignmentData = data.assignmentData;
    dataVersion = Number(data.dataVersion) || 1;
  } catch (e) { /* 壊れたデータは無視して初期値で起動 */ }
  migrateOrganizationData();
}

function migrateOrganizationData() {
  if (!groups.length) groups = structuredClone(DEFAULT_GROUPS);
  if (dataVersion < 2 && config.industry === "care" && !duties.some(duty => duty.id === "shuttle" || duty.name === "送迎")) {
    duties.unshift(structuredClone(INDUSTRY_TEMPLATES.care.duties[0]));
  }
  dataVersion = 2;
  employees.forEach(emp => {
    if (groups.some(group => group.id === emp.groupId)) return;
    const text = `${emp.role || ""} ${emp.qual || ""}`;
    if (groups.some(group => group.id === "nurse") && /看護|ナース/.test(text)) emp.groupId = "nurse";
    else if (groups.some(group => group.id === "day-service") && /調理|デイ/.test(text)) emp.groupId = "day-service";
    else emp.groupId = groups[0].id;
  });
}

/* ---------- ユーティリティ ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function getGroup(groupId) {
  return groups.find(group => group.id === groupId) || groups[0];
}
function getDuty(dutyId) {
  return duties.find(duty => duty.id === dutyId) || null;
}
function getAssignment(empId, iso) {
  return getDuty(assignmentData[empId]?.[iso]);
}
function makeId(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
}
function formatDate(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function parseISO(iso) {
  // new Date("YYYY-MM-DD") は UTC 扱いになり曜日がずれることがあるためローカル日付で生成
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function lastDayOf(y, m) { return new Date(y, m, 0).getDate(); } // m: 1-12
function dayClass(dt) {
  const w = dt.getDay();
  if (holidays.has(formatDate(dt))) return "holiday";
  return w === 0 ? "sun" : (w === 6 ? "sat" : "");
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
function isMobileView() {
  return window.matchMedia("(max-width: 760px)").matches;
}
function getVisibleDays(days) {
  if (!isMobileView()) return days;
  const maxStart = Math.max(0, Math.floor((days.length - 1) / 7) * 7);
  mobileWeekStart = Math.min(maxStart, Math.max(0, mobileWeekStart));
  return days.slice(mobileWeekStart, mobileWeekStart + 7);
}
function renderMobilePeriodNav(days, visibleDays) {
  if (!visibleDays.length) return;
  const first = visibleDays[0], last = visibleDays[visibleDays.length - 1];
  const label = `${first.getMonth() + 1}/${first.getDate()}（${weekdaysJp[first.getDay()]}）` +
    `〜 ${last.getMonth() + 1}/${last.getDate()}（${weekdaysJp[last.getDay()]}）`;
  document.getElementById("mobile-range").textContent = label;
  document.getElementById("mobile-prev").disabled = mobileWeekStart === 0;
  document.getElementById("mobile-next").disabled = mobileWeekStart + 7 >= days.length;
}
function shiftMobileWeek(direction) {
  mobileWeekStart += direction * 7;
  render();
  document.querySelector(".table-container").scrollLeft = 0;
}

/* ---------- 期間計算 ---------- */
function isMonthEndClosing() {
  const c = String(config.closing).trim();
  const n = parseInt(c, 10);
  return c === "" || c.includes("末") || isNaN(n) || n >= 31 || n < 1;
}
function getCalendarDays() {
  const y = config.year, m = config.month;
  let start, end;
  if (isMonthEndClosing()) {
    start = new Date(y, m - 1, 1);
    end = new Date(y, m - 1, lastDayOf(y, m));
  } else {
    const c = parseInt(config.closing, 10);
    // 前月の締め日の翌日 〜 当月の締め日（短い月は末日で丸める）
    const prevY = m === 1 ? y - 1 : y, prevM = m === 1 ? 12 : m - 1;
    start = new Date(prevY, prevM - 1, Math.min(c, lastDayOf(prevY, prevM)) + 1);
    end = new Date(y, m - 1, Math.min(c, lastDayOf(y, m)));
  }
  const days = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) days.push(new Date(d));
  return days;
}

/* ---------- 集計 ---------- */
function getShift(emp, dt) {
  const iso = formatDate(dt);
  if (!shiftData[emp.id]) shiftData[emp.id] = {};
  if (!shiftData[emp.id][iso]) {
    shiftData[emp.id][iso] = emp.unwork.includes(dt.getDay()) ? "休" : "日";
  }
  return shiftData[emp.id][iso];
}
function summarize(emp, days) {
  let workDays = 0, hours = 0, nightHours = 0, paidDays = 0, nightCount = 0;
  days.forEach(dt => {
    const t = SHIFT_BY_CODE[getShift(emp, dt)];
    if (!t) return;
    if (t.kind === "day") { workDays++; hours += emp.times.work; }
    if (t.kind === "night") { workDays++; nightCount++; hours += emp.times.night; nightHours += emp.times.night; }
    if (t.kind === "paid") paidDays++;
  });
  return { workDays, hours, nightHours, paidDays, nightCount };
}
function isViolation(emp, dt, code) {
  const t = SHIFT_BY_CODE[code];
  return emp.unwork.includes(dt.getDay()) && t && (t.kind === "day" || t.kind === "night");
}

/* ---------- 描画 ---------- */
function renderHeader() {
  document.getElementById("disp-company").textContent = config.company;
  document.getElementById("disp-facility").textContent = config.facility;
  document.getElementById("disp-title").textContent = `${config.year}年 ${config.month}月度 勤務表`;
  document.getElementById("disp-closing").textContent = isMonthEndClosing() ? "末日" : `${parseInt(config.closing, 10)}日`;
  document.getElementById("disp-payment").textContent = config.payment;
}

function renderGroupFilter() {
  if (activeGroupFilter !== "all" && !groups.some(group => group.id === activeGroupFilter)) activeGroupFilter = "all";
  const filter = document.getElementById("group-filter");
  filter.innerHTML = [
    `<button class="group-tab ${activeGroupFilter === "all" ? "active" : ""}" data-group-filter="all">全体</button>`,
    ...groups.map(group => `<button class="group-tab ${activeGroupFilter === group.id ? "active" : ""}" data-group-filter="${esc(group.id)}"><span class="group-dot" style="background:${group.color}"></span>${esc(group.name)}</button>`),
    `<button class="group-action" type="button" onclick="quickAddGroup()" aria-label="グループを追加">＋ 追加</button>`,
    ...(activeGroupFilter === "all" ? [] : [`<button class="group-action rename" type="button" onclick="renameActiveGroup()" aria-label="選択中のグループ名を変更">✎ 名称変更</button>`])
  ].join("");
}

function render() {
  renderHeader();
  renderGroupFilter();
  const days = getCalendarDays();
  if (days.length === 0) return;
  const visibleDays = getVisibleDays(days);
  renderMobilePeriodNav(days, visibleDays);
  document.getElementById("disp-period").textContent = `${formatDate(days[0])} 〜 ${formatDate(days[days.length - 1])}`;

  // ヘッダー
  let head = `<th class="col-staff">氏名</th><th class="col-info">ID</th><th class="col-info">役職</th><th class="col-info">資格・立場</th>`;
  visibleDays.forEach(dt => {
    head += `<th class="${dayClass(dt)}">${dt.getDate()}<span class="wd">${weekdaysJp[dt.getDay()]}</span></th>`;
  });
  head += `<th class="col-stat s1">夜勤<span class="wd">時間</span></th><th class="col-stat s2">総実働</th><th class="col-stat s3">出勤<span class="wd">日数</span></th>`;
  document.getElementById("head-row").innerHTML = head;

  // 本体
  const dayCount = visibleDays.map(() => 0), nightCount = visibleDays.map(() => 0);
  let body = "";
  const displayedGroups = activeGroupFilter === "all" ? groups : groups.filter(group => group.id === activeGroupFilter);
  const totalColumns = 1 + 3 + visibleDays.length + 3;
  displayedGroups.forEach(group => {
    const members = employees.filter(emp => emp.groupId === group.id);
    body += `<tr class="group-heading"><td colspan="${totalColumns}"><span class="group-dot" style="background:${group.color}"></span> ${esc(group.name)}<span class="group-count">${members.length}人</span></td></tr>`;
    members.forEach(emp => {
      const s = summarize(emp, days);
      let row = `<tr><td class="col-staff" title="${esc(emp.id)} / ${esc(emp.role)} / ${esc(emp.qual)}">
        <div class="staff-name"><span>${esc(emp.name)}</span>
          <span class="staff-actions no-print"><button onclick="openEmpModal('${esc(emp.id)}')" title="編集">✎</button></span></div>
        <div class="staff-group"><span class="group-dot" style="background:${group.color}"></span>${esc(group.name)}</div>
        <div class="staff-meta mobile-summary">${s.workDays}日・${s.hours}h</div></td>
        <td class="col-info">${esc(emp.id)}</td><td class="col-info">${esc(emp.role)}</td><td class="col-info">${esc(emp.qual)}</td>`;
      visibleDays.forEach((dt, i) => {
        const iso = formatDate(dt);
        const val = getShift(emp, dt);
        const t = SHIFT_BY_CODE[val];
        const duty = getAssignment(emp.id, iso);
        if (t && t.kind === "day") dayCount[i]++;
        if (t && t.kind === "night") nightCount[i]++;
        const vio = isViolation(emp, dt, val) ? " violation" : "";
        const dutyLabel = duty ? ` / 担当: ${duty.name}` : "";
        row += `<td class="shift-cell ${dayClass(dt)} shift-${esc(val)}${vio}" data-emp="${esc(emp.id)}" data-iso="${iso}" title="${esc(emp.name)} / ${dt.getMonth()+1}月${dt.getDate()}日 / ${esc(t?.label || val)}${esc(dutyLabel)}"><span class="shift-code">${esc(val)}</span>${duty ? `<span class="duty-code" style="color:${duty.color}">${esc(duty.code)}</span>` : ""}</td>`;
      });
      row += `<td class="col-stat s1">${s.nightHours}h</td><td class="col-stat s2">${s.hours}h</td><td class="col-stat s3">${s.workDays}日</td></tr>`;
      body += row;
    });
  });
  if (!displayedGroups.some(group => employees.some(emp => emp.groupId === group.id))) {
    body += `<tr><td colspan="${totalColumns}" style="padding:24px; color:#64748b;">このグループにはスタッフが登録されていません。</td></tr>`;
  }
  document.getElementById("table-body").innerHTML = body;

  // 日別人数
  const footRow = (label, counts, need) => {
    let r = `<tr><td class="col-staff" title="必要人数 ${need}">${label}<div class="staff-meta">必要${need}人</div></td><td class="col-info" colspan="3"></td>`;
    counts.forEach(c => { r += `<td class="${c < need ? "short" : ""}">${c}</td>`; });
    return r + `<td class="col-stat s1"></td><td class="col-stat s2"></td><td class="col-stat s3"></td></tr>`;
  };
  document.getElementById("table-foot").innerHTML =
    footRow("日勤帯", dayCount, config.needDay) + footRow("夜勤", nightCount, config.needNight);

  save();
}

function renderPalette() {
  const p = document.getElementById("palette");
  let html = `<span class="palette-label">入力モード:</span>
    <button class="brush brush-none ${brush === null ? "active" : ""}" data-brush="">クリックで選択</button>`;
  SHIFT_TYPES.forEach(t => {
    html += `<button class="brush ${brush === t.code ? "active" : ""}" style="background:${t.color}; color:#fff;" data-brush="${t.code}">${t.label}</button>`;
  });
  html += `<label class="info-toggle"><input type="checkbox" id="toggle-info" ${showInfo ? "checked" : ""}>役職・資格も表示</label>`;
  html += `<span class="palette-hint">ブラシを選ぶとドラッグで連続入力できます（Esc で解除）</span>`;
  p.innerHTML = html;
  document.body.classList.toggle("brush-active", brush !== null);

  const pop = document.getElementById("popover");
  pop.innerHTML = `<div class="popover-section"><span class="popover-label">勤務区分</span>${SHIFT_TYPES.map(t => `<button style="background:${t.color}" data-code="${t.code}">${t.label}</button>`).join("")}</div>
    <div class="popover-section"><span class="popover-label">当日の担当（勤務区分と別に設定）</span>
      <button class="duty-clear" data-clear-duty="1">担当なし</button>
      ${duties.map(duty => `<button class="duty-btn" style="border-color:${duty.color}; color:${duty.color}" data-duty="${esc(duty.id)}">${esc(duty.name)}</button>`).join("") || `<span class="settings-note">設定画面から担当を追加できます。</span>`}
    </div>`;
}

/* ---------- セル入力 ---------- */
function setShift(empId, iso, code, { confirmViolation }) {
  const emp = employees.find(e => e.id === empId);
  if (!emp) return false;
  const dt = parseISO(iso);
  if (confirmViolation && isViolation(emp, dt, code)) {
    if (!confirm(`【契約警告】${emp.name} さんは契約上 ${weekdaysJp[dt.getDay()]}曜日 勤務不可です。登録しますか？`)) return false;
  }
  if (shiftData[empId][iso] === code) return false;
  shiftData[empId][iso] = code;
  const type = SHIFT_BY_CODE[code];
  if (type && ["off", "paid"].includes(type.kind) && assignmentData[empId]) delete assignmentData[empId][iso];
  return true;
}

function setDuty(empId, iso, dutyId) {
  if (!assignmentData[empId]) assignmentData[empId] = {};
  if (!dutyId) {
    delete assignmentData[empId][iso];
    return true;
  }
  if (!duties.some(duty => duty.id === dutyId)) return false;
  assignmentData[empId][iso] = dutyId;
  return true;
}

function openPopover(cell) {
  activeTarget = { empId: cell.dataset.emp, iso: cell.dataset.iso };
  const pop = document.getElementById("popover");
  pop.style.display = "flex";
  const r = cell.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - pw - 8);
  let top = r.bottom + 4;
  if (top + ph > window.innerHeight - 8) top = r.top - ph - 4; // 下に入らなければ上に出す
  pop.style.left = `${Math.max(8, left)}px`;
  pop.style.top = `${Math.max(8, top)}px`;
}
function closePopover() {
  document.getElementById("popover").style.display = "none";
  activeTarget = null;
}

function paintAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest(".shift-cell");
  if (cell && setShift(cell.dataset.emp, cell.dataset.iso, brush, { confirmViolation: false })) render();
}

function initEvents() {
  const table = document.getElementById("shift-table");

  table.addEventListener("pointerdown", e => {
    const cell = e.target.closest(".shift-cell");
    if (!cell) return;
    if (brush) {
      painting = true;
      e.preventDefault();
      paintAt(e.clientX, e.clientY);
    } else {
      e.stopPropagation();
      openPopover(cell);
    }
  });
  document.addEventListener("pointermove", e => { if (painting) paintAt(e.clientX, e.clientY); });
  document.addEventListener("pointerup", () => { painting = false; });

  document.getElementById("popover").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn || !activeTarget) return;
    const { empId, iso } = activeTarget;
    if (btn.dataset.code) {
      closePopover();
      if (setShift(empId, iso, btn.dataset.code, { confirmViolation: true })) render();
      return;
    }
    if (btn.dataset.duty || btn.dataset.clearDuty) {
      closePopover();
      if (setDuty(empId, iso, btn.dataset.duty || null)) render();
    }
  });
  document.getElementById("popover").addEventListener("pointerdown", e => e.stopPropagation());
  document.addEventListener("pointerdown", closePopover);

  document.getElementById("palette").addEventListener("change", e => {
    if (e.target.id !== "toggle-info") return;
    showInfo = e.target.checked;
    document.body.classList.toggle("show-info", showInfo);
  });
  document.getElementById("palette").addEventListener("click", e => {
    const btn = e.target.closest("button[data-brush]");
    if (!btn) return;
    brush = btn.dataset.brush || null;
    renderPalette();
  });
  document.getElementById("group-filter").addEventListener("click", e => {
    const btn = e.target.closest("button[data-group-filter]");
    if (!btn) return;
    activeGroupFilter = btn.dataset.groupFilter;
    render();
  });

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    closePopover();
    closeModals();
    if (brush) { brush = null; renderPalette(); }
  });
}

/* ---------- 設定 ---------- */
function fillConfigForm() {
  document.getElementById("cfg-company").value = config.company;
  document.getElementById("cfg-facility").value = config.facility;
  document.getElementById("cfg-year").value = config.year;
  document.getElementById("cfg-month").value = config.month;
  document.getElementById("cfg-closing").value = config.closing;
  document.getElementById("cfg-payment").value = config.payment;
  document.getElementById("cfg-need-day").value = config.needDay;
  document.getElementById("cfg-need-night").value = config.needNight;
  document.getElementById("cfg-industry").value = config.industry || "custom";
  renderOrganizationSettings();
}
function updateConfig() {
  const month = parseInt(document.getElementById("cfg-month").value, 10);
  const year = parseInt(document.getElementById("cfg-year").value, 10);
  config = {
    company: document.getElementById("cfg-company").value,
    facility: document.getElementById("cfg-facility").value,
    year: isNaN(year) ? config.year : year,
    month: isNaN(month) ? config.month : Math.min(12, Math.max(1, month)),
    closing: document.getElementById("cfg-closing").value.trim(),
    payment: document.getElementById("cfg-payment").value,
    needDay: Math.max(0, parseInt(document.getElementById("cfg-need-day").value, 10) || 0),
    needNight: Math.max(0, parseInt(document.getElementById("cfg-need-night").value, 10) || 0),
    industry: config.industry || "custom"
  };
  mobileWeekStart = 0;
  fillConfigForm();
  render();
}
function shiftMonth(delta) {
  let m = config.month + delta, y = config.year;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  config.year = y; config.month = m;
  mobileWeekStart = 0;
  fillConfigForm();
  render();
}
function clearPeriod() {
  if (!confirm("表示中の期間のシフトを初期状態（契約上の休みは公休、それ以外は日勤）に戻しますか？")) return;
  const isos = getCalendarDays().map(formatDate);
  employees.forEach(emp => isos.forEach(iso => {
    if (shiftData[emp.id]) delete shiftData[emp.id][iso];
    if (assignmentData[emp.id]) delete assignmentData[emp.id][iso];
  }));
  render();
  toast("この期間のシフトを初期化しました");
}

function renderOrganizationSettings() {
  const groupList = document.getElementById("group-settings-list");
  const dutyList = document.getElementById("duty-settings-list");
  if (!groupList || !dutyList) return;
  groupList.innerHTML = groups.map(group => `<div class="settings-item group-item">
    <span class="group-dot" style="background:${group.color}"></span>
    <input value="${esc(group.name)}" aria-label="グループ名" onchange="renameGroup('${group.id}', this.value)">
    <button type="button" onclick="deleteGroup('${group.id}')" title="削除">×</button>
  </div>`).join("");
  dutyList.innerHTML = duties.map(duty => `<div class="settings-item">
    <span class="group-dot" style="background:${duty.color}"></span>
    <input value="${esc(duty.name)}" aria-label="担当名" onchange="renameDuty('${duty.id}', 'name', this.value)">
    <input value="${esc(duty.code)}" maxlength="2" aria-label="担当略称" onchange="renameDuty('${duty.id}', 'code', this.value)">
    <button type="button" onclick="deleteDuty('${duty.id}')" title="削除">×</button>
  </div>`).join("") || `<p class="settings-note">担当はまだありません。必要な役割だけ追加してください。</p>`;
}

function applyIndustryTemplate() {
  const key = document.getElementById("cfg-industry").value;
  const template = INDUSTRY_TEMPLATES[key];
  if (!template) return;
  if (!confirm("選択した業種のグループと担当に置き換えます。現在の担当設定は解除されます。続けますか？")) return;
  groups = structuredClone(template.groups);
  duties = structuredClone(template.duties);
  assignmentData = {};
  config.industry = key;
  employees.forEach(emp => {
    if (groups.some(group => group.id === emp.groupId)) return;
    const text = `${emp.role || ""} ${emp.qual || ""}`;
    if (key === "care" && /看護|ナース/.test(text)) emp.groupId = "nurse";
    else if (key === "care" && /調理|デイ/.test(text)) emp.groupId = "day-service";
    else emp.groupId = groups[0].id;
  });
  activeGroupFilter = "all";
  renderOrganizationSettings();
  renderPalette();
  render();
  toast("業種テンプレートを適用しました");
}

function addGroup() {
  const input = document.getElementById("new-group-name");
  const name = input.value.trim();
  if (!name) return alert("グループ名を入力してください");
  if (groups.some(group => group.name === name)) return alert("同じ名前のグループが既にあります");
  groups.push({ id: makeId("group"), name, color: GROUP_COLORS[groups.length % GROUP_COLORS.length] });
  config.industry = "custom";
  document.getElementById("cfg-industry").value = "custom";
  input.value = "";
  renderOrganizationSettings();
  render();
  toast(`${name}を追加しました`);
}

function quickAddGroup() {
  const entered = prompt("追加するグループ・部署名を入力してください\n例：給食、清掃、製造、外注");
  const name = entered?.trim();
  if (!name) return;
  if (groups.some(group => group.name === name)) return alert("同じ名前のグループが既にあります");
  const group = { id: makeId("group"), name, color: GROUP_COLORS[groups.length % GROUP_COLORS.length] };
  groups.push(group);
  config.industry = "custom";
  activeGroupFilter = group.id;
  const industry = document.getElementById("cfg-industry");
  if (industry) industry.value = "custom";
  renderOrganizationSettings();
  render();
  toast(`${name}を追加しました`);
}

function renameActiveGroup() {
  const group = groups.find(item => item.id === activeGroupFilter);
  if (!group) return alert("名称を変更するグループを先に選んでください");
  const entered = prompt("グループ・部署名を変更してください", group.name);
  const name = entered?.trim();
  if (!name || name === group.name) return;
  if (groups.some(item => item.id !== group.id && item.name === name)) return alert("同じ名前のグループが既にあります");
  renameGroup(group.id, name);
  toast(`${name}に変更しました`);
}

function renameGroup(id, value) {
  const group = groups.find(item => item.id === id);
  const name = value.trim();
  if (!group || !name) return renderOrganizationSettings();
  group.name = name;
  config.industry = "custom";
  document.getElementById("cfg-industry").value = "custom";
  renderOrganizationSettings();
  render();
}

function deleteGroup(id) {
  if (groups.length <= 1) return alert("グループは1つ以上必要です");
  const group = getGroup(id);
  if (!group || !confirm(`${group.name}を削除しますか？所属スタッフは先頭のグループへ移動します。`)) return;
  groups = groups.filter(item => item.id !== id);
  employees.forEach(emp => { if (emp.groupId === id) emp.groupId = groups[0].id; });
  if (activeGroupFilter === id) activeGroupFilter = "all";
  config.industry = "custom";
  document.getElementById("cfg-industry").value = "custom";
  renderOrganizationSettings();
  render();
}

function addDuty() {
  const nameInput = document.getElementById("new-duty-name");
  const codeInput = document.getElementById("new-duty-code");
  const name = nameInput.value.trim();
  const code = (codeInput.value.trim() || name.slice(0, 1)).slice(0, 2);
  if (!name) return alert("担当名を入力してください");
  if (duties.some(duty => duty.name === name)) return alert("同じ名前の担当が既にあります");
  duties.push({ id: makeId("duty"), name, code, color: GROUP_COLORS[duties.length % GROUP_COLORS.length] });
  config.industry = "custom";
  document.getElementById("cfg-industry").value = "custom";
  nameInput.value = ""; codeInput.value = "";
  renderOrganizationSettings();
  renderPalette();
  toast(`${name}を追加しました`);
}

function renameDuty(id, field, value) {
  const duty = duties.find(item => item.id === id);
  const next = value.trim();
  if (!duty || !next) return renderOrganizationSettings();
  duty[field] = field === "code" ? next.slice(0, 2) : next;
  config.industry = "custom";
  document.getElementById("cfg-industry").value = "custom";
  renderPalette();
  render();
}

function deleteDuty(id) {
  const duty = getDuty(id);
  if (!duty || !confirm(`${duty.name}を削除しますか？登録済みの担当表示も解除されます。`)) return;
  duties = duties.filter(item => item.id !== id);
  Object.values(assignmentData).forEach(assignments => {
    Object.keys(assignments).forEach(iso => { if (assignments[iso] === id) delete assignments[iso]; });
  });
  config.industry = "custom";
  document.getElementById("cfg-industry").value = "custom";
  renderOrganizationSettings();
  renderPalette();
  render();
}

function toggleDrawer() {
  const d = document.getElementById("drawer");
  const b = document.getElementById("drawer-backdrop");
  d.classList.toggle("open");
  b.style.display = d.classList.contains("open") ? "block" : "none";
  if (d.classList.contains("open")) renderOrganizationSettings();
}

/* ---------- スタッフ追加・編集 ---------- */
function nextEmpId() {
  const nums = employees.map(e => parseInt(String(e.id).replace(/\D/g, ""), 10)).filter(n => !isNaN(n));
  return "EMP" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0");
}
function openModal(id) {
  document.getElementById("modal-backdrop").style.display = "block";
  document.getElementById(id).style.display = "block";
}
function closeModals() {
  document.getElementById("modal-backdrop").style.display = "none";
  document.querySelectorAll(".modal-box").forEach(m => m.style.display = "none");
}
function openEmpModal(empId) {
  const emp = empId ? employees.find(e => e.id === empId) : null;
  editingEmpId = emp ? emp.id : null;
  document.getElementById("emp-modal-title").textContent = emp ? "スタッフ情報の編集" : "新規スタッフ追加（雇用契約連携）";
  document.getElementById("emp-id").value = emp ? emp.id : nextEmpId();
  document.getElementById("emp-id").disabled = !!emp;
  document.getElementById("emp-name").value = emp ? emp.name : "";
  document.getElementById("emp-role").value = emp ? emp.role : "";
  document.getElementById("emp-qual").value = emp ? emp.qual : "";
  document.getElementById("emp-work").value = emp ? emp.times.work : 8;
  document.getElementById("emp-night").value = emp ? emp.times.night : 0;
  document.getElementById("emp-group").innerHTML = groups.map(group =>
    `<option value="${esc(group.id)}" ${emp && emp.groupId === group.id ? "selected" : ""}>${esc(group.name)}</option>`).join("");
  document.getElementById("emp-delete").style.display = emp ? "" : "none";
  document.getElementById("emp-unwork").innerHTML = weekdaysJp.map((w, i) =>
    `<label><input type="checkbox" value="${i}" ${emp && emp.unwork.includes(i) ? "checked" : ""}>${w}</label>`).join("");
  openModal("modal-emp");
  document.getElementById("emp-name").focus();
}
function submitEmp() {
  const id = document.getElementById("emp-id").value.trim();
  const name = document.getElementById("emp-name").value.trim();
  if (!id) return alert("スタッフIDを入力してください");
  if (!name) return alert("氏名を入力してください");
  if (!editingEmpId && employees.some(e => e.id === id)) return alert(`スタッフID「${id}」は既に使われています`);

  const data = {
    id, name,
    role: document.getElementById("emp-role").value.trim() || "スタッフ",
    qual: document.getElementById("emp-qual").value.trim() || "介護福祉士",
    groupId: document.getElementById("emp-group").value || groups[0].id,
    unwork: [...document.querySelectorAll("#emp-unwork input:checked")].map(i => parseInt(i.value, 10)),
    times: {
      work: parseFloat(document.getElementById("emp-work").value) || 0,
      night: parseFloat(document.getElementById("emp-night").value) || 0
    }
  };
  if (editingEmpId) {
    const idx = employees.findIndex(e => e.id === editingEmpId);
    employees[idx] = data;
    toast(`${name} さんの情報を更新しました`);
  } else {
    employees.push(data);
    toast(`${name} さんを追加しました`);
  }
  closeModals();
  render();
}
function deleteEmp() {
  const emp = employees.find(e => e.id === editingEmpId);
  if (!emp || !confirm(`${emp.name} さんを削除しますか？（シフトデータも削除されます）`)) return;
  employees = employees.filter(e => e.id !== emp.id);
  delete shiftData[emp.id];
  delete assignmentData[emp.id];
  closeModals();
  render();
  toast(`${emp.name} さんを削除しました`);
}

/* ---------- 給与連携 ---------- */
let payrollCache = [];
function buildPayroll() {
  const days = getCalendarDays();
  const period = `${formatDate(days[0])}〜${formatDate(days[days.length - 1])}`;
  return employees.map(emp => {
    const s = summarize(emp, days);
    const dutyCounts = {};
    days.forEach(dt => {
      const duty = getAssignment(emp.id, formatDate(dt));
      if (duty) dutyCounts[duty.name] = (dutyCounts[duty.name] || 0) + 1;
    });
    return {
      employeeId: emp.id,
      name: emp.name,
      group: getGroup(emp.groupId)?.name || "",
      targetPeriod: period,
      workDays: s.workDays,
      nightShifts: s.nightCount,
      paidLeaveDays: s.paidDays,
      totalHours: s.hours,
      nightHours: s.nightHours,
      duties: Object.entries(dutyCounts).map(([name, count]) => `${name}:${count}回`).join(" / ")
    };
  });
}
function exportPayroll() {
  payrollCache = buildPayroll();
  document.getElementById("pay-json").value = JSON.stringify(payrollCache, null, 2);
  openModal("modal-pay");
}
function toCSV(rows) {
  const headers = ["社員ID","氏名","グループ・部署","対象期間","出勤日数","夜勤回数","有休日数","総実働(h)","夜勤時間(h)","担当回数"];
  const keys = ["employeeId","name","group","targetPeriod","workDays","nightShifts","paidLeaveDays","totalHours","nightHours","duties"];
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  return [headers.map(q).join(","), ...rows.map(r => keys.map(k => q(r[k])).join(","))].join("\r\n");
}
function downloadPayroll(type) {
  const isCsv = type === "csv";
  // Excel で文字化けしないよう CSV には BOM を付ける
  const content = isCsv ? "\uFEFF" + toCSV(payrollCache) : JSON.stringify(payrollCache, null, 2);
  const blob = new Blob([content], { type: isCsv ? "text/csv" : "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `payroll_${config.year}-${String(config.month).padStart(2, "0")}.${type}`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function copyPayroll() {
  const ta = document.getElementById("pay-json");
  (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject())
    .then(() => toast("コピーしました"))
    .catch(() => { ta.select(); document.execCommand("copy"); toast("コピーしました"); });
}

window.addEventListener("DOMContentLoaded", () => {
  load();
  fillConfigForm();
  renderPalette();
  initEvents();
  render();
  window.addEventListener("resize", () => {
    const mobile = isMobileView();
    if (mobile === wasMobileView) return;
    wasMobileView = mobile;
    mobileWeekStart = 0;
    render();
  });
});
</script>
